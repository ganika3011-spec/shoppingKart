version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: shopping_kart_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-shopping_cart}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-securepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopping_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shopping_kart_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopping_network

  # Django Application
  web:
    build: .
    container_name: shopping_kart_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --config gunicorn_config.py Kart.wsgi:application"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-securepassword}@db:5432/${DATABASE_NAME:-shopping_cart}
      - CACHE_LOCATION=redis://redis:6379/1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopping_network
    restart: unless-stopped

  # Celery Worker (for async tasks)
  celery:
    build: .
    container_name: shopping_kart_celery
    command: celery -A Kart worker -l info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-securepassword}@db:5432/${DATABASE_NAME:-shopping_cart}
      - CACHE_LOCATION=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    networks:
      - shopping_network
    restart: unless-stopped

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: .
    container_name: shopping_kart_celery_beat
    command: celery -A Kart beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-securepassword}@db:5432/${DATABASE_NAME:-shopping_cart}
      - CACHE_LOCATION=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    networks:
      - shopping_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shopping_kart_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_config.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - web
    networks:
      - shopping_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  shopping_network:
    driver: bridge
