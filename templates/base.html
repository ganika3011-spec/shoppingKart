{% load static %}

<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="cache-control" content="max-age=604800" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#007bff">

  <title>ShoppingKart | One of the Biggest Online Shopping Platform</title>

  <link href="{% static 'images/favicon.ico' %}" rel="shortcut icon" type="image/x-icon">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Bootstrap 4 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Modern Styles -->
  <link href="{% static 'css/modern.css' %}" rel="stylesheet" type="text/css"/>
  <link href="{% static 'css/custom.css' %}" rel="stylesheet" type="text/css"/>

  <!-- Custom JavaScript -->
  <script src="{% static 'js/script.js' %}" type="text/javascript"></script>
  <script src="{% static 'js/modern.js' %}" type="text/javascript"></script>

  <style>
    :root {
      --primary: #007bff;
      --primary-dark: #0056b3;
      --primary-light: #e7f1ff;
    }
  </style>
</head>
<body>
  {% include 'includes/navbar.html' %}
  
  <main id="main-content">
    {% block content %}
    {% endblock %}
  </main>
  
  {% include 'includes/footer.html' %}
  {% include 'includes/chatbot.html' %}

  <!-- Toast Messages Container -->
  <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

  <script>
    // Scroll to top button
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.header-top');
      if (window.scrollY > 50) {
        navbar?.classList.add('scrolled');
      } else {
        navbar?.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
</html>
