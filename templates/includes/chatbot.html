<!-- AI Chatbot Widget -->
<style>
    #chatbot-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 350px;
        max-height: 500px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    #chatbot-widget.minimized {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        cursor: pointer;
    }
    #chatbot-header {
        background: #3167eb;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
    }
    #chatbot-body {
        flex-grow: 1;
        overflow-y: auto;
        padding: 15px;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .chat-message {
        padding: 8px 12px;
        border-radius: 12px;
        max-width: 80%;
        font-size: 14px;
        line-height: 1.4;
    }
    .user-message {
        align-self: flex-end;
        background: #3167eb;
        color: white;
    }
    .ai-message {
        align-self: flex-start;
        background: #e9ecef;
        color: #212529;
    }
    #chatbot-input-container {
        padding: 10px;
        border-top: 1px solid #dee2e6;
        display: flex;
        gap: 8px;
    }
    #chatbot-input {
        flex-grow: 1;
        border: 1px solid #ced4da;
        border-radius: 20px;
        padding: 8px 15px;
        outline: none;
    }
    #chatbot-send {
        background: #3167eb;
        color: white;
        border: none;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #chatbot-toggle-icon {
        font-size: 24px;
    }
    .typing {
        font-style: italic;
        color: #6c757d;
        font-size: 12px;
    }
</style>

<div id="chatbot-widget" class="minimized">
    <div id="chatbot-header" onclick="toggleChatbot()">
        <span id="chatbot-title" style="display:none;">Shopping Assistant</span>
        <span id="chatbot-toggle-icon">💬</span>
    </div>
    <div id="chatbot-body" style="display:none;">
        <div class="chat-message ai-message">Hi! I'm your Shopping Assistant. How can I help you today?</div>
    </div>
    <div id="chatbot-input-container" style="display:none;">
        <input type="text" id="chatbot-input" placeholder="Ask me anything...">
        <button id="chatbot-send" onclick="sendMessage()">
            <i class="fa fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    function toggleChatbot() {
        const widget = document.getElementById('chatbot-widget');
        const title = document.getElementById('chatbot-title');
        const body = document.getElementById('chatbot-body');
        const input = document.getElementById('chatbot-input-container');
        const icon = document.getElementById('chatbot-toggle-icon');

        if (widget.classList.contains('minimized')) {
            widget.classList.remove('minimized');
            title.style.display = 'block';
            body.style.display = 'flex';
            input.style.display = 'flex';
            icon.innerText = '×';
        } else {
            widget.classList.add('minimized');
            title.style.display = 'none';
            body.style.display = 'none';
            input.style.display = 'none';
            icon.innerText = '💬';
        }
    }

    async function sendMessage() {
        const input = document.getElementById('chatbot-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = '';

        const typingIndicator = document.createElement('div');
        typingIndicator.className = 'typing';
        typingIndicator.innerText = 'AI is typing...';
        document.getElementById('chatbot-body').appendChild(typingIndicator);
        document.getElementById('chatbot-body').scrollTop = document.getElementById('chatbot-body').scrollHeight;

        try {
            const response = await fetch('/store/chatbot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    messages: [{ text: text }]
                })
            });
            const data = await response.json();
            
            typingIndicator.remove();
            
            if (data.status === 'success') {
                appendMessage('ai', data.response);
            } else {
                appendMessage('ai', 'Sorry, I encountered an error: ' + data.message);
            }
        } catch (error) {
            typingIndicator.remove();
            appendMessage('ai', 'Sorry, I could not connect to the server.');
        }
    }

    function appendMessage(role, text) {
        const body = document.getElementById('chatbot-body');
        const div = document.createElement('div');
        div.className = `chat-message ${role}-message`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    document.getElementById('chatbot-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
