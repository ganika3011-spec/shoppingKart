{% extends "base.html" %}



{% block content %}
<section class="section-conten padding-y bg">
{% include "includes/alerts.html" %}
<div class="container">
	<div class="row">
	{% include 'includes/dashboard_sidebar.html' %}
	<main class="col-md-9">
		<article class="card">
		<header class="card-header">
			<strong class="d-inline-block mr-3">Change Your Password</strong>
			<span>{{ user.full_name }}</span>
		</header>
		<div class="card-body">
            
			<div class="row"> 
				
				<div class="col-md-12">
                    <form action="{% url 'change_password'%}" method="POST" >
                        {%csrf_token %}
                        
                        <div class="form-group">
                            <label for=""> Current Password</label>
                               <input type="password" class="form-control" name="current_password" placeholder="Enter Current Password" required>

                        </div>
                        <div class="form-group">
                            <label for="">Create New Password</label>
                                <input type="password" class="form-control" name="create_new_password" placeholder="Enter New Password" required>

                        </div>
                        <div class="form-group">
                            <label for="">Confirm New Password</label>
                                <input type="password" class="form-control" name="confirm_new_password" placeholder="Enter Confirm Password" required>

                        </div>
                            
                        </div>
                        <input type="submit" value="submit" class="btn btn-primary">
                    </form>
					
				</div>
				
			</div> <!-- row.// -->
		</div> <!-- card-body .// -->
		
		</article> <!-- order-group.// --> 
	</main>
</div> <!-- row.// -->
</div>


</section>
{% endblock %}
