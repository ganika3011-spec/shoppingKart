{% extends "base.html" %}



{% block content %}
<section class="section-conten padding-y bg">
{% include "includes/alerts.html" %}
<div class="container">
	<div class="row">
	{% include 'includes/dashboard_sidebar.html' %}
	<main class="col-md-9">
		<article class="card">
		<header class="card-header">
			<strong class="d-inline-block mr-3">Edit Your Profile</strong>
			<span>{{ user.full_name }}</span>
		</header>
		<div class="card-body">
            <div>
                <img src="{{userprofile.profile_picture.url}}" alt="profile picture"width="100px" style=
                "border-radius: 50%;">
            </div>
			<div class="row"> 
				
				<div class="col-md-12">
                    <form action="{% url 'edit_profile'%}" method="POST" enctype="multipart/form-data">
                        {%csrf_token %}
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for=""> First Name</label>
                                <input type="text" class="form-control" value="{{user.first_name}}" >
                            </div>
                            <div class="form-group col-md-6">
                                <label for=""> Last Name</label>
                                <input type="text" class="form-control" value="{{user.last_name}}" >
                            </div>
                            <div class="form-group col-md-6">
                                <label for=""> Phone Number</label>
                                <input type="text" class="form-control" value="{{userprofile.phone_number}}" >
                            </div>
                            <div class="form-group col-md-6">
                                <label for=""> ProfilePicture</label>
                                <input type="file" class="form-control" name="profile_picture">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for=""> Address Line 1</label>
                               <input type="text" class="form-control" value="{{userprofile.address_line_1}}" >

                        </div>
                        <div class="form-group">
                            <label for=""> Address Line 2</label>
                                <input type="text" class="form-control" value="{{userprofile.address_line_2}}" >

                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for=""> City</label>
                               <input type="text" class="form-control" value="{{userprofile.city}}" >
                            </div>
                            <div class="form-group col-md-4">
                                <label for=""> State</label>
                                <input type="text" class="form-control" value="{{userprofile.state}}">
                            </div>
                            <div class="form-group col-md-4">
                                <label > Country</label>
                                <input type="text" class="form-control" value="{{userprofile.country}}">
                            </div>
                            
                        </div>
                        <input type="submit" value="Save" class="btn btn-primary">
                    </form>
					
				</div>
				
			</div> <!-- row.// -->
		</div> <!-- card-body .// -->
		
		</article> <!-- order-group.// --> 
	</main>
</div> <!-- row.// -->
</div>


</section>
{% endblock %}
